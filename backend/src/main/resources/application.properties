spring.application.name=backend
# Server
server.port=8080

# Database (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/bookstore_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Flyway (disabled to avoid creating flyway_schema_history)
spring.flyway.enabled=true
# If you later enable Flyway, baseline can help adopt existing schemas
spring.flyway.baseline-on-migrate=true

# JWT (override with environment variable JWT_SECRET for production security)
jwt.secret=${JWT_SECRET:VerySecretChangeThisToAStrongRandomStringMustBeAtLeast32CharsLong123}
jwt.expiration-ms=86400000
# Short-lived reset token (15 minutes by default)
jwt.reset-expiration-ms=900000

# Mail (configure real SMTP credentials in production)
spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=changeMe
spring.mail.password=changeMe
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=no-reply@bookstore.local

# Application URLs for email links
app.verification-base-url=http://localhost:3000/verify
app.password-reset-base-url=http://localhost:3000/reset-password

# File upload settings
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

# Logging
logging.level.org.springframework=INFO
