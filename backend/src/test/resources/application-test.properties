spring.application.name=backend-test
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable Flyway for tests
spring.flyway.enabled=false

# JWT (short expiration for tests and long enough secret for HS256)
jwt.secret=TestSecretKeyChangeLongEnoughForHS256_123456
jwt.expiration-ms=60000

# Mail (use dummy host; JavaMailSender will be mocked in unit tests)
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.from=test@example.com

app.verification-base-url=http://test.local/verify
app.password-reset-base-url=http://test.local/reset-password
